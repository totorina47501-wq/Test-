name: BitGold React frontend
on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'frontend/**'
      - 'server/Dockerfile.react-preview'
      - 'server/src/index.js'
      - 'server/public/bitgold-v4.js'
      - '.github/workflows/react-frontend.yml'
  push:
    branches: [staging, main]
    paths:
      - 'frontend/**'
      - 'server/public/bitgold-v4.js'
      - '.github/workflows/react-frontend.yml'
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies deterministically
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build React
        working-directory: frontend
        run: npm run build
      - name: Check legacy carousel script syntax
        run: node --check server/public/bitgold-v4.js

  preview-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build optional React preview image
        run: docker build -f server/Dockerfile.react-preview -t bitgold-react-preview .
      - name: Check bundled React preview assets
        run: |
          docker run --rm --entrypoint sh bitgold-react-preview -c 'test -f /app/react-preview/index.html && test -d /app/react-preview/assets'
