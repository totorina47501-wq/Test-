name: BitGold tests
on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitgold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bitgold_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bitgold_test
      DATABASE_SSL: "false"
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-32-characters-minimum-0001
      TWO_FACTOR_ENCRYPTION_KEY: test-two-factor-encryption-key-32chars
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: node --check src/index.js
      - run: node --check public/app.js
      - run: npm test
