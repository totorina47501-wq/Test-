name: BitGold tests
# CI trigger: x402 quote-binding validation
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitgold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bitgold_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bitgold_test
      DATABASE_SSL: "false"
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-32-characters-minimum-0001
      TWO_FACTOR_ENCRYPTION_KEY: test-two-factor-encryption-key-32chars
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Validate Dockerfile and production configuration contract
        run: |
          test -f Dockerfile
          grep -q 'NODE_ENV=production' Dockerfile
          grep -q 'JWT_SECRET must be configured' src/index.js
          grep -q 'TWO_FACTOR_ENCRYPTION_KEY must be configured' src/index.js
      - name: Build production container
        run: docker build -t bitgold-ci:${{ github.sha }} .
      - name: Smoke-test production container and health endpoint
        run: |
          set -eu
          docker network create bitgold-ci-net
          docker run -d --name bitgold-ci-db --network bitgold-ci-net \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=bitgold_test postgres:16
          for i in $(seq 1 30); do
            if docker exec bitgold-ci-db pg_isready -U postgres -d bitgold_test; then break; fi
            sleep 2
          done
          docker run -d --name bitgold-ci-app --network bitgold-ci-net \
            -e NODE_ENV=production \
            -e DATABASE_SSL=false \
            -e DATABASE_URL=postgresql://postgres:postgres@bitgold-ci-db:5432/bitgold_test \
            -e JWT_SECRET=ci-smoke-jwt-secret-32-characters-long \
            -e TWO_FACTOR_ENCRYPTION_KEY=ci-smoke-2fa-key-32-characters-long \
            bitgold-ci:${{ github.sha }}
          ok=0
          for i in $(seq 1 40); do
            if docker run --rm --network bitgold-ci-net curlimages/curl:8.12.1 -fsS http://bitgold-ci-app:3000/api/health; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            docker logs bitgold-ci-app
            exit 1
          fi
      - name: Run quality checks and tests in parallel
        run: |
          set +e

          npm run check:html &
          pid_html=$!

          npm run check:css &
          pid_css=$!

          npm run check:js &
          pid_js=$!

          npm test &
          pid_test=$!

          status=0
          for pid in "$pid_html" "$pid_css" "$pid_js" "$pid_test"; do
            wait "$pid" || status=1
          done

          exit "$status"
