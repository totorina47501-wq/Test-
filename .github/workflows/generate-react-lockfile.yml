name: Generate React lockfile (temporary)
on:
  push:
    branches:
      - feat/react-reproducible-build-361-20261010
    paths:
      - '.github/workflows/generate-react-lockfile.yml'
permissions:
  contents: write
jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile from package manifest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate deterministic install and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit lockfile to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build(react): generate npm lockfile #361'
          git push origin HEAD:feat/react-reproducible-build-361-20261010
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: warn
