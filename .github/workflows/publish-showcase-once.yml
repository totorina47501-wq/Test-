name: Publish reviewed BitGold showcase (one-time)
on:
  push:
    branches: [feat/publish-showcase-captures-20261012]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reuse existing validated showcase capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p server/public/showcase
          gh run download 38236397131 --repo "$GITHUB_REPOSITORY" --name bitgold-showcase-captures --dir server/public/showcase
          test -s server/public/showcase/landing-desktop.png
          test -s server/public/showcase/landing-mobile.png
          test -s server/public/showcase/investir.png
          test -s server/public/showcase/cockpit.png
          file server/public/showcase/*.png
      - name: Commit vetted screenshots and remove one-time workflow
        run: |
          rm .github/workflows/publish-showcase-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/public/showcase/*.png .github/workflows/publish-showcase-once.yml
          git commit -m "assets(landing): publish existing reviewed public showcase captures"
          git push origin HEAD:feat/publish-showcase-captures-20261012
