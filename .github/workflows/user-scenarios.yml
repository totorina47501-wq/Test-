name: BitGold user journeys (PR, staging, production, daily)

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [staging]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  # Replace superseded PR checks; keep each push, scheduled and manual run independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  user-scenarios:
    name: Signup, login, simulated trades and responsive UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bitgold_scenarios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bitgold_scenarios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      COMPLIANCE_ENFORCEMENT: 'false'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bitgold_scenarios
      DATABASE_SSL: 'false'
      JWT_SECRET: isolated-user-scenario-jwt-secret-32-chars
      TWO_FACTOR_ENCRYPTION_KEY: isolated-user-scenario-2fa-key-32chars
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build React preview for authenticated browser journeys
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Mount React preview into the isolated server
        run: |
          rm -rf react-preview
          cp -R ../frontend/dist react-preview
      - name: Validate Playwright spec syntax
        run: npm run check:playwright
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated BitGold server
        run: |
          node src/index.js > /tmp/bitgold-scenarios-server.log 2>&1 &
          echo $! > /tmp/bitgold-scenarios-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/bitgold-scenarios-server.log
          exit 1
      - name: Execute user scenarios (simulation only)
        run: node scripts/user-scenarios.mjs
      - name: Generate visitor showcase captures
        run: node scripts/capture-showcase.mjs
      - name: Upload anonymized showcase captures
        uses: actions/upload-artifact@v4
        with:
          name: bitgold-showcase-captures
          path: server/public/showcase/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Browser E2E (desktop and mobile)
        run: npx playwright test --config=playwright.config.mjs --ignore-snapshots --grep-invert='production authenticated account is readable without mutations'
      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitgold-scenario-reports
          path: |
            server/playwright-report/
            server/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print server diagnostics on failure
        if: failure()
        run: tail -n 120 /tmp/bitgold-scenarios-server.log || true
